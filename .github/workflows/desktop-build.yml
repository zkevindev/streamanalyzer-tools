name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

env:
  WAILS_VERSION: v3.1.0

jobs:
  windows:
    name: Windows (amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${env:WAILS_VERSION}
      - name: Build executable
        shell: pwsh
        run: wails3 build
      - uses: actions/upload-artifact@v4
        with:
          name: streamanalyzer-windows-amd64
          path: build/bin/streamanalyzer.exe
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@"${WAILS_VERSION}"
      - name: Build application and DMG
        run: wails3 task package:darwin
      - uses: actions/upload-artifact@v4
        with:
          name: streamanalyzer-macos-${{ matrix.arch }}
          path: build/bin/StreamAnalyzer-${{ matrix.arch }}.dmg
          if-no-files-found: error

  linux:
    name: Linux (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libpcap-dev
      - name: Install Wails
        run: go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@"${WAILS_VERSION}"
      - name: Build executable
        run: wails3 build
      - uses: actions/upload-artifact@v4
        with:
          name: streamanalyzer-linux-amd64
          path: build/bin/streamanalyzer
          if-no-files-found: error

  release:
    name: Attach files to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
      - macos
      - linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release if needed and upload files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" --clobber
