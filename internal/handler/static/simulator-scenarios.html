<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模拟器场景回归 · Stream Analyzer</title>
  <link rel="stylesheet" href="/static/workbench-theme.css">
  <link rel="stylesheet" href="/static/diagnostics.css">
  <link rel="stylesheet" href="/static/simulators.css">
  <script src="/static/hls.min.js" defer></script>
  <script src="/static/mpegts.js" defer></script>
  <script src="/static/player-diagnostics.js" defer></script>
  <script src="/static/simulator-scenarios.js" defer></script>
  <script src="/static/workbench-navigation.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">跳转到主要内容</a>
  <!-- workbench-header -->
  <main id="main" tabindex="-1">
    <!-- simulator-protocols -->
    <div class="page-heading"><div><h1>场景回归</h1><p class="muted">保存 GB28181、RTSP、WHEP、RTMP 和 HLS 场景，对比重复运行结果</p></div></div>
    <p id="notice" class="error" role="alert" hidden></p>
    <div class="simulator-grid">
      <section class="panel">
        <div class="panel-heading"><h2>场景配置</h2></div>
        <div class="panel-body">
          <form id="scenario-form">
            <fieldset id="config">
              <div class="sim-fields">
                <div><label for="name">名称</label><input id="name" maxlength="80" value="GB28181 点播回环" required></div>
                <div><label for="scenario">预期场景</label><select id="scenario">
                  <option value="gb-passed">GB28181 收到关键帧</option>
                  <option value="gb-no_ack">GB28181 暂缓 ACK</option>
                  <option value="gb-no_rtp">GB28181 ACK 后无 RTP</option>
                  <option value="gb-tcp_recovery">GB28181 SIP TCP 断开后恢复点播</option>
                  <option value="gb-udp_recovery">GB28181 UDP 心跳无应答后恢复点播</option>
                  <option value="gb-media_recovery">GB28181 在线断流后恢复点播</option>
                  <option value="rtsp-source_port">RTSP UDP 来源端口变化后恢复</option>
                  <option value="rtsp-fallback">RTSP UDP 无媒体后回退 TCP</option>
                  <option value="rtsp-resolution">RTSP 同会话切换分辨率后继续呈帧</option>
                  <option value="rtsp-reconnect">RTSP 会话断开后重新出画</option>
                  <option value="rtsp-rtp_drop">RTSP 按 N 丢 1 触发序号缺口与报文明细</option>
                  <option value="rtsp-not_found">RTSP DESCRIBE 返回 404 故障定位</option>
                  <option value="rtsp-redirect">RTSP DESCRIBE 返回 302 重定向</option>
                  <option value="whep-normal">WHEP 模拟源正常建连与 RTP 采样</option>
                  <option value="whep-auth_401">WHEP 信令 401 鉴权失败定位</option>
                  <option value="whep-rtp_drop">WHEP RTP 丢包注入与缺口检测</option>
                  <option value="rtmp-normal">RTMP 模拟源正常拉流与帧采样</option>
                  <option value="rtmp-app_reject">RTMP app_connect 拒绝连接定位</option>
                  <option value="rtmp-stream_not_found">RTMP play 流不存在定位</option>
                  <option value="hls-not_found">HLS 直播首次 404 后恢复</option>
                  <option value="hls-truncate">HLS 直播正文截断后恢复</option>
                  <option value="hls-audio_boundary">HLS 音视频跨不连续边界错位</option>
                  <option value="ts-late_pat">MPEG-TS 组播加入后 PAT 延迟</option>
                  <option value="ts-late_pmt">MPEG-TS 组播加入后 PMT 延迟</option>
                  <option value="hls-key_rotation">HLS AES-128 正常轮换</option>
                  <option value="hls-key_forbidden">HLS AES-128 新密钥 403 后恢复</option>
                  <option value="hls-stale">HLS 直播列表序号回退并恢复</option>
                  <option value="hls-part_delay">LL-HLS Part 延迟后恢复</option>
                </select></div>
              </div>
              <label for="preset">已保存预设</label>
              <select id="preset"><option value="">选择预设</option></select>
              <div class="sim-controls">
                <button id="run" type="submit">运行场景</button>
                <button id="save" type="button" class="secondary">保存预设</button>
                <button id="export-preset" type="button" class="secondary">导出预设</button>
              </div>
              <label for="import-preset">导入预设 JSON</label>
              <input id="import-preset" type="file" accept=".json,application/json">
            </fieldset>
          </form>
          <p class="muted field-hint">播放场景运行时请保持页面在前台，可观察实际播放器恢复。</p>
          <p class="field-hint" id="progress" role="status">等待运行</p>
          <video id="scenario-player" controls muted playsinline aria-label="场景播放器" hidden></video>
        </div>
      </section>
      <section class="panel">
        <div class="panel-heading"><h2>运行记录</h2></div>
        <div class="panel-body">
          <p id="comparison" class="field-hint" hidden></p>
          <p id="empty-history" class="muted">暂无运行记录</p>
          <ol id="run-history" class="session-timeline" hidden></ol>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
