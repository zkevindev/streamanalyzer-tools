<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务记录 · Stream Analyzer</title>
    <link rel="stylesheet" href="/static/workbench-theme.css">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{background:var(--bg);color:var(--text);min-height:100dvh;font-size:14px;line-height:1.55}
        .container{max-width:1440px;margin:0 auto}
        .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
        .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-sm)}
        table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
        th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
        th{background:var(--surface-inset);font-weight:500;font-size:12px;color:var(--muted)}
        tr:last-child td{border-bottom:none}
        tbody tr:hover td{background:var(--surface-inset)}
        .pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:var(--radius-xs);font-size:12px;font-weight:500;border:1px solid var(--border);background:var(--surface-inset);color:var(--text-secondary);white-space:nowrap}
        .pill::before{content:"";width:6px;height:6px;border-radius:999px;background:var(--muted);flex:none}
        .pill.running,.pill.queued,.pill.pending{background:var(--accent-light);color:var(--accent-hover);border-color:var(--accent-border)}
        .pill.running::before,.pill.queued::before,.pill.pending::before{background:var(--accent)}
        .pill.done,.pill.passed{background:var(--success-bg);color:var(--success);border-color:var(--success-border)}
        .pill.done::before,.pill.passed::before{background:var(--success-dot)}
        .pill.partial{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-border)}
        .pill.partial::before{background:var(--warn-dot)}
        .pill.stopped,.pill.failed{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-border)}
        .pill.stopped::before,.pill.failed::before{background:var(--danger-dot)}
        .meta-tag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:var(--radius-xs);font-size:11px;font-weight:500;border:1px solid var(--border);background:var(--surface-inset);color:var(--text-secondary);font-family:var(--font-data);vertical-align:middle}
        .meta-tag.protected{border-color:var(--accent-border);background:var(--accent-light);color:var(--accent-hover)}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;background:var(--primary);color:var(--primary-ink);text-decoration:none;padding:6px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;border:1px solid var(--primary);cursor:pointer;transition:background-color var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
        .btn:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
        .btn:active{transform:scale(.99)}
        .btn.secondary{background:var(--surface);color:var(--text);border-color:var(--border-strong);box-shadow:var(--shadow)}
        .btn.secondary:hover{background:var(--surface-hover);border-color:rgb(17 20 24 / .24)}
        .actions{display:flex;gap:6px;flex-wrap:wrap}
        .actions button,.actions .btn{min-height:28px;padding:4px 10px;font-size:12px}
        .empty{text-align:center;padding:40px 16px;color:var(--muted);font-size:13px}
        .history-list{padding:0;overflow:hidden}
        .history-list .table-wrap{border:0;border-radius:0}
        .history-list th,.history-list td{padding:12px 18px}
        .history-filters{display:flex;flex-wrap:wrap;align-items:end;gap:12px;padding:1.2rem 1.25rem;background:var(--surface-inset);border-bottom:1px solid var(--border)}
        .history-filters > div{min-width:min(100%, 9rem)}
        .history-search-field{position:relative;display:block;color:var(--muted)}
        .history-search-field svg{width:1.14rem;height:1.14rem;position:absolute;inset-inline-start:.65rem;top:50%;transform:translateY(-50%);pointer-events:none}
        .history-filters .history-search-field input{padding-inline-start:2.15rem}
        .history-filters label{display:block;margin-bottom:6px;font-size:13px;font-weight:500;color:var(--text-secondary)}
        .history-filters input,.history-filters select{min-height:36px;width:100%;min-width:0;padding:6px 12px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font:inherit;font-size:14px;transition:border-color var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease)}
        .history-filters input:focus,.history-filters select:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
        .history-filters .history-search{flex:1 1 224px}
        .history-status{margin:0;padding:.7rem 1.25rem;color:var(--muted);font:400 13px/1.4 var(--font-data);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;border-bottom:1px solid var(--border)}
        @media(max-width:35rem){.history-filters > div{flex:1 1 8rem;min-width:0}.history-filters .history-search{flex-basis:100%}.history-list th,.history-list td{padding-inline:.85rem}}
        td.history-input{min-width:208px;max-width:420px;white-space:normal;overflow-wrap:anywhere}
        td.history-input code{display:block;margin-top:4px;color:var(--muted);font-family:var(--font-data);font-size:12px}
        .history-sub{display:block;margin-top:4px;color:var(--muted);font-size:12px;font-family:var(--font-data)}
        #taskBody .btn{display:inline-flex;align-items:center;text-decoration:none;white-space:nowrap}
    </style>
    <script src="/static/workbench-navigation.js" defer></script>
</head>
<body class="workbench-tool-page history-page">
  <!-- workbench-header -->
    <main id="main" class="container" tabindex="-1">
        <header class="workbench-heading">
            <h1 class="workbench-page-title">任务记录</h1>
            <p class="workbench-page-description">按来源、协议、状态、地址或文件检索任务并查看结果。</p>
        </header>

        <section class="card history-list" aria-label="任务列表">
            <form id="history-filters" class="history-filters" aria-label="筛选任务记录">
                <div class="history-search">
                    <label for="history-query">搜索记录</label>
                    <span class="history-search-field">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/></svg>
                        <input type="search" id="history-query" placeholder="地址、文件名、协议或任务 ID">
                    </span>
                </div>
                <div>
                    <label for="history-source">任务来源</label>
                    <select id="history-source">
                        <option value="all">全部来源</option>
                        <option value="diagnostic">排障采样</option>
                        <option value="offline">离线解析</option>
                        <option value="simulator">模拟器回归</option>
                    </select>
                </div>
                <div>
                    <label for="history-protocol">协议 / 格式</label>
                    <select id="history-protocol">
                        <option value="all">全部协议</option>
                    </select>
                </div>
                <div>
                    <label for="history-state">任务状态</label>
                    <select id="history-state">
                        <option value="all">全部状态</option>
                        <option value="active">进行中</option>
                        <option value="finished">已结束</option>
                        <option value="error">失败或部分完成</option>
                    </select>
                </div>
                <button type="button" class="btn secondary" id="reset-filters" hidden>重置筛选</button>
                <button type="button" class="btn secondary" id="refresh-history">刷新</button>
            </form>
            <p id="history-status" class="history-status" role="status">正在读取任务…</p>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th scope="col">来源与协议</th><th scope="col">地址或文件</th><th scope="col">状态</th><th scope="col">记录时间</th><th scope="col">操作</th></tr>
                    </thead>
                    <tbody id="taskBody"></tbody>
                </table>
            </div>
            <p id="emptyState" class="empty" hidden></p>
        </section>
    </main>

    <script>
        'use strict';

        const historySources = {
            diagnostic: { title: '排障采样', path: '/api/diagnostics/runs', rows: value => value || [] },
            offline: { title: '离线解析', path: '/api/offline/tasks', rows: value => value.tasks || [] },
            simulator: { title: '模拟器回归', path: '/api/simulators/runs?summary=1', rows: value => value.map(task => ({...task, status: task.passed ? 'passed' : 'failed'})) },
        };
        const historyStates = {
            queued: '排队中', pending: '待处理', running: '进行中', stopping: '正在停止',
            done: '已完成', stopped: '已停止', partial: '部分完成', passed: '通过', failed: '失败',
            canceled: '已取消', cancelled: '已取消', interrupted: '服务中断',
        };
        const historyActive = new Set(['queued', 'pending', 'running', 'stopping']);
        const historyErrors = new Set(['failed', 'partial', 'interrupted']);
        const historyDate = new Intl.DateTimeFormat('zh-CN', {dateStyle: 'short', timeStyle: 'medium'});
        let historyRows = [];
        let historyUnavailable = [];
        let historyRequest = 0;

        function readableAddress(value) {
            if (!value) return '—';
            try {
                const url = new URL(value);
                url.username = url.password = url.search = url.hash = '';
                return url.href;
            } catch {
                return String(value);
            }
        }

        function formatBytes(n) {
            const v = Number(n);
            if (!Number.isFinite(v) || v <= 0) return '';
            if (v < 1024) return v + ' B';
            if (v < 1024 * 1024) return (v / 1024).toFixed(1) + ' KB';
            if (v < 1024 * 1024 * 1024) return (v / 1024 / 1024).toFixed(2) + ' MB';
            return (v / 1024 / 1024 / 1024).toFixed(2) + ' GB';
        }

        function resolveFormat(kind, task) {
            if (kind === 'simulator') {
                const scenario = String(task.preset?.scenario || '');
                const family = scenario.split('-')[0].toLowerCase();
                const labels = { gb: 'GB28181', rtsp: 'RTSP', whep: 'WHEP', rtmp: 'RTMP', hls: 'HLS', ts: 'UDP-TS' };
                return labels[family] || (family ? family.toUpperCase() : 'SCENARIO');
            }
            const raw = String(task.protocol || task.mode || task.type || task.command || '').toUpperCase();
            if (raw === 'RTMP' && String(task.origin || task.url || '').startsWith('rtmps://')) return 'RTMPS';
            return raw;
        }

        function refreshProtocolOptions() {
            const select = document.getElementById('history-protocol');
            const current = select.value;
            const formats = Array.from(new Set(historyRows.map(row => row.format).filter(Boolean))).sort();
            select.replaceChildren(new Option('全部协议', 'all'), ...formats.map(f => new Option(f, f)));
            select.value = formats.includes(current) ? current : 'all';
        }

        function putHistoryCell(row, text, className) {
            const cell = row.insertCell();
            cell.textContent = text;
            if (className) cell.className = className;
            return cell;
        }

        function historyLink(label, path) {
            const link = document.createElement('a');
            link.className = 'btn secondary';
            link.textContent = label;
            link.href = path;
            return link;
        }

        function appendMetaTag(container, text, cls) {
            const tag = document.createElement('span');
            tag.className = 'meta-tag' + (cls ? ' ' + cls : '');
            tag.textContent = text;
            container.append(tag);
        }

        function showHistory() {
            const source = document.getElementById('history-source').value;
            const protocol = document.getElementById('history-protocol').value;
            const filter = document.getElementById('history-state').value;
            const query = document.getElementById('history-query').value.trim().toLowerCase();
            const hasFilter = source !== 'all' || protocol !== 'all' || filter !== 'all' || Boolean(query);
            document.getElementById('reset-filters').hidden = !hasFilter;

            const tbody = document.getElementById('taskBody');
            tbody.replaceChildren();
            let shown = 0;

            for (const {kind, task, date, input, format, detail} of historyRows) {
                const state = task.status || '';
                if (source !== 'all' && source !== kind) continue;
                if (protocol !== 'all' && format !== protocol) continue;
                if (filter === 'active' && !historyActive.has(state)) continue;
                if (filter === 'finished' && historyActive.has(state)) continue;
                if (filter === 'error' && !historyErrors.has(state)) continue;
                if (query && !`${input} ${task.id} ${format} ${detail}`.toLowerCase().includes(query)) continue;

                shown++;
                const row = tbody.insertRow();
                const srcCell = putHistoryCell(row, historySources[kind].title);
                if (format) appendMetaTag(srcCell, format);
                if (kind === 'diagnostic' && task.protected) appendMetaTag(srcCell, '重要证据', 'protected');
                if (kind === 'diagnostic' && task.mode === 'replay') appendMetaTag(srcCell, '复盘');
                if (kind === 'offline' && task.source_type === 'local') appendMetaTag(srcCell, '本机直读');

                const context = putHistoryCell(row, input, 'history-input');
                if (detail) {
                    const sub = document.createElement('span');
                    sub.className = 'history-sub';
                    sub.textContent = detail;
                    context.append(sub);
                }
                const id = document.createElement('code');
                id.textContent = task.id;
                context.append(id);

                const status = document.createElement('span');
                status.className = `pill${historyStates[state] ? ' ' + state : ''}`;
                status.textContent = historyStates[state] || state || '未知';
                row.insertCell().append(status);

                putHistoryCell(row, Number.isFinite(date) ? historyDate.format(date) : '—');

                const actions = putHistoryCell(row, '', 'actions');
                const encodedID = encodeURIComponent(task.id);
                if (kind === 'diagnostic') {
                    actions.append(historyLink('查看记录', '/diagnostics#' + encodedID));
                } else if (kind === 'offline') {
                    actions.append(historyLink('查看解析', '/offline?task=' + encodedID));
                } else if (kind === 'simulator') {
                    actions.append(historyLink('查看回归', '/simulators/scenarios#run-' + encodedID));
                }
            }

            const empty = document.getElementById('emptyState');
            empty.textContent = historyRows.length ? '没有符合筛选条件的记录。' : '暂无历史记录。';
            empty.hidden = shown > 0 || (historyRows.length === 0 && historyUnavailable.length > 0);
            const available = historyUnavailable.length ? ` · 暂时无法读取${historyUnavailable.join('、')}` : '';
            document.getElementById('history-status').textContent = `显示 ${shown} 条，共 ${historyRows.length} 条${available}`;
        }

        async function loadAllTasks() {
            const refresh = document.getElementById('refresh-history');
            refresh.disabled = true;
            const request = ++historyRequest;
            const groups = Object.entries(historySources);
            const response = await Promise.allSettled(groups.map(async ([kind, source]) => {
                const res = await fetch(source.path, {cache: 'no-store'});
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return source.rows(await res.json()).filter(task => typeof task.id === 'string').map(task => {
                    const detailParts = [];
                    if (kind === 'offline' && task.input_size) detailParts.push(formatBytes(task.input_size));
                    if (kind === 'simulator' && task.detail) detailParts.push(task.detail);
                    if (kind === 'simulator' && Number.isFinite(task.elapsed_ms)) detailParts.push(task.elapsed_ms + ' ms');
                    return {
                        kind,
                        task,
                        date: Date.parse(task.start_time || task.created_at || task.started_at),
                        input: task.preset?.name || task.input_name || readableAddress(task.url || task.origin),
                        format: resolveFormat(kind, task),
                        detail: detailParts.join(' · '),
                    };
                });
            }));
            if (request !== historyRequest) return;
            historyUnavailable = [];
            historyRows = response.flatMap((group, index) => {
                if (group.status === 'fulfilled') return group.value;
                historyUnavailable.push(groups[index][1].title);
                return [];
            }).sort((a, b) => (b.date || 0) - (a.date || 0));
            refresh.disabled = false;
            refreshProtocolOptions();
            showHistory();
        }

        const filters = document.getElementById('history-filters');
        filters.addEventListener('submit', event => event.preventDefault());
        filters.addEventListener('input', showHistory);
        filters.addEventListener('change', showHistory);
        document.getElementById('reset-filters').addEventListener('click', () => {
            document.getElementById('history-source').value = 'all';
            document.getElementById('history-protocol').value = 'all';
            document.getElementById('history-state').value = 'all';
            document.getElementById('history-query').value = '';
            showHistory();
        });
        document.getElementById('refresh-history').addEventListener('click', loadAllTasks);
        loadAllTasks();
    </script>
</body>
</html>
