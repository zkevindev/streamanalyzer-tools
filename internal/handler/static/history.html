<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史记录 · Stream Analyzer</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{--bg:#fafaf9;--surface:#ffffff;--border:#e8e6e1;--text:#1a1918;--text-muted:#78716c;--accent:#d97757;--accent-hover:#c4684a;--accent-light:#fef3ec;--radius:.875rem;--shadow:0 2px 12px rgba(0,0,0,.05);--shadow-md:0 4px 20px rgba(0,0,0,.08)}
        body{font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;line-height:1.5}
        .container{max-width:1200px;margin:0 auto}
        .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;box-shadow:var(--shadow);margin-bottom:1.5rem}
        .card-title{font-size:1rem;font-weight:600;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
        .back-link{display:inline-flex;align-items:center;gap:.375rem;color:var(--text-muted);text-decoration:none;font-size:.875rem;padding:.5rem .875rem;border-radius:8px;transition:all .2s ease}
        .back-link:hover{color:var(--text);background:rgba(0,0,0,.04)}
        .back-link svg{width:14px;height:14px}
        .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius)}
        table{width:100%;border-collapse:collapse;font-size:.8125rem}
        th,td{padding:.75rem 1rem;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
        th{background:#fafaf9;font-weight:500;font-size:.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em}
        tr:last-child td{border-bottom:none}
        tr:hover td{background:#fafaf9}
        tr.active td{background:#eff6ff}
        .task-id{font-family:ui-monospace,monospace;font-size:.8125rem;background:#f3f4f6;padding:.125rem .375rem;border-radius:.25rem}
        .pill{display:inline-block;padding:.25rem .625rem;border-radius:999px;font-size:.6875rem;font-weight:500}
        .pill.running{background:#dcfce7;color:#166534}
        .pill.stopped{background:#fee2e2;color:#991b1b}
        .btn{display:inline-flex;align-items:center;gap:.375rem;background:var(--accent);color:#fff;text-decoration:none;padding:.5rem .875rem;border-radius:.5rem;font-size:.8125rem;font-weight:500;border:none;cursor:pointer;transition:all .2s ease}
        .btn:hover{background:var(--accent-hover);transform:translateY(-1px)}
        .btn:active{transform:scale(.98)}
        .btn.stop{background:#dc2626}.btn.stop:hover{background:#b91c1c}
        .btn.secondary{background:#1a1918}.btn.secondary:hover{background:#2d2c2a}
        .btn.success{background:#059669}.btn.success:hover{background:#047857}
        .actions{display:flex;gap:.375rem}.actions button{padding:.375rem .625rem;font-size:.75rem}
        .empty{text-align:center;padding:3rem;color:var(--text-muted);font-size:.875rem}
        .detail{margin-top:1.5rem;display:none}
        .detail-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:.75rem}
        .detail-title{font-size:1rem;font-weight:600}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:.75rem;background:#fafaf9;padding:1rem;border-radius:.75rem;margin-bottom:1rem}
        .stat-item{text-align:center}
        .stat-value{font-size:1.25rem;font-weight:700;color:var(--text)}
        .stat-label{font-size:.6875rem;color:var(--text-muted);margin-top:.25rem;text-transform:uppercase;letter-spacing:.03em}
        .chart-tabs{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap}
        .chart-tabs button{padding:.5rem .875rem;font-size:.8125rem;border:1px solid var(--border);background:var(--surface);border-radius:.5rem;cursor:pointer;transition:all .2s ease}
        .chart-tabs button:hover{border-color:var(--accent);color:var(--accent)}
        .chart-tabs button.active{background:var(--text);color:#fff;border-color:var(--text)}
        .chart-frame{width:100%;height:400px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:1rem}
        .chart-table{overflow:auto;max-height:250px;border:1px solid var(--border);border-radius:var(--radius)}
        .chart-table table{font-size:.75rem}
        .chart-table th,.chart-table td{padding:.5rem .75rem}
        .chart-table th{background:#fafaf9;position:sticky;top:0}
        .chart-table th.video{color:#2563eb}
        .chart-table th.audio{color:#059669}
        .metadata-box{background:#1a1918;color:#e2e8f0;border-radius:.75rem;padding:1rem;font-size:.75rem;max-height:180px;overflow:auto;margin-top:1rem;white-space:pre-wrap;word-break:break-all}
        .hls-wrap{margin-top:1rem}
        .hls-wrap .hint{font-size:.8125rem;color:var(--text-muted);margin-bottom:.75rem}
        .hls-table-wrap{overflow:auto;max-height:420px;border:1px solid var(--border);border-radius:var(--radius)}
        .hls-table-wrap table{font-size:.72rem}
        .hls-table-wrap th,.hls-table-wrap td{padding:.45rem .5rem;vertical-align:top}
        .hls-table-wrap th{background:#fafaf9;position:sticky;top:0}
        .hls-uri{max-width:220px;word-break:break-all}
        @media(max-width:640px){.stats-grid{grid-template-columns:repeat(3,1fr)}}
        .history-filters{display:flex;flex-wrap:wrap;align-items:end;gap:.65rem;margin-bottom:.65rem}
        .history-filters label{display:block;margin-bottom:.2rem;font-size:.82rem;font-weight:650}
        .history-filters input,.history-filters select{min-height:2.75rem;width:100%;min-width:0;padding:.45rem .55rem;border:1px solid var(--border);border-radius:.375rem;background:var(--surface-inset);color:var(--text);font:inherit}
        .history-filters .history-search{flex:1 1 13rem}
        .history-status{margin:.4rem 0 .5rem;color:var(--muted);font-size:.875rem;overflow-wrap:anywhere}
        td.history-input{min-width:13rem;max-width:25rem;white-space:normal;overflow-wrap:anywhere}
        td.history-input code{display:block;margin-top:.2rem;color:var(--muted);font-size:.75rem}
        #taskBody .btn{display:inline-flex;align-items:center;text-decoration:none;white-space:nowrap}
    </style>
  <link rel="stylesheet" href="/static/workbench-theme.css">
    <script src="/static/workbench-navigation.js" defer></script>
</head>
<body class="workbench-tool-page">
  <!-- workbench-header -->
    <div class="container">
    <!-- diagnostic-tools -->
        <h1 class="workbench-page-title">历史记录</h1>

        <div class="card">
            <form id="history-filters" class="history-filters" aria-label="筛选历史记录">
                <div><label for="history-source">任务来源</label><select id="history-source"><option value="all">全部来源</option><option value="diagnostic">排障采样</option><option value="realtime">实时分析</option><option value="offline">离线解析</option></select></div>
                <div><label for="history-state">任务状态</label><select id="history-state"><option value="all">全部状态</option><option value="active">进行中</option><option value="finished">已结束</option><option value="error">失败或部分完成</option></select></div>
                <div class="history-search"><label for="history-query">搜索记录</label><input type="search" id="history-query" placeholder="地址、文件名或任务 ID"></div>
                <button type="button" class="btn secondary" id="refresh-history">刷新</button>
            </form>
            <p id="history-status" class="history-status" role="status">正在读取任务…</p>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th scope="col">来源</th><th scope="col">地址或文件</th><th scope="col">状态</th><th scope="col">记录时间</th><th scope="col">操作</th></tr>
                    </thead>
                    <tbody id="taskBody"></tbody>
                </table>
            </div>
            <p id="emptyState" class="empty" hidden></p>
        </div>

        <div id="analysisSection" class="detail">
            <div class="card">
                <div class="detail-header">
                    <div class="detail-title">分析详情 - <span id="currentTaskTitle"></span></div>
                    <button class="btn secondary" onclick="closeAnalysis()">关闭</button>
                </div>
                <div id="statsGrid" class="stats-grid"></div>
                <div id="mediaFilterTabs" class="chart-tabs" style="margin-bottom:.5rem">
                    <button type="button" class="active" data-filter="all" onclick="setMediaFilter('all')">全部</button>
                    <button type="button" data-filter="video" onclick="setMediaFilter('video')">视频</button>
                    <button type="button" data-filter="audio" onclick="setMediaFilter('audio')">音频</button>
                </div>
                <div id="flvChartTabs" class="chart-tabs">
                    <button type="button" class="active" data-chart="timestamp" onclick="showChart('timestamp')">DTS</button>
                    <button type="button" data-chart="length" onclick="showChart('length')">数据长度</button>
                    <button type="button" data-chart="iframe" onclick="showChart('iframe')">I帧间隔</button>
                    <button type="button" data-chart="gop" onclick="showChart('gop')">GOP大小</button>
                    <button type="button" data-chart="bitrate" onclick="showChart('bitrate')">码率</button>
                    <button type="button" data-chart="fps" onclick="showChart('fps')">帧率</button>
                    <button type="button" data-chart="avsync" onclick="showChart('avsync')">AV偏差</button>
                    <button type="button" class="success" onclick="downloadXLSX()">下载XLSX</button>
                </div>
                <div id="mainChart" class="chart-frame"></div>
                <pre id="metadataBox" class="metadata-box">metadata: -</pre>
                <div id="chartTable" class="chart-table" style="display:none">
                    <table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table>
                </div>
                <div id="hlsSection" class="hls-wrap" style="display:none">
                    <p class="hint">HLS（TS）任务按<strong>切片</strong>展示：URI、编号、时长，以及切片内音视频 PTS/DTS（90kHz）与首帧 PTS 差（AV）。</p>
                    <p class="hint" style="margin-top:.35rem">以下为<strong>新增</strong>图表（按切片序号横轴）；与 FLV/RTMP 帧级图表独立。</p>
                    <div id="hlsChartTabs" class="chart-tabs" style="margin-bottom:1rem">
                        <button type="button" class="active" data-hls-chart="hls-ts" onclick="showHlsChart('hls-ts')">时间戳(PTS/DTS)</button>
                        <button type="button" data-hls-chart="hls-avdts" onclick="showHlsChart('hls-avdts')">AV DTS差</button>
                        <button type="button" data-hls-chart="hls-iframe" onclick="showHlsChart('hls-iframe')">I帧间隔</button>
                    </div>
                    <div id="hlsMainChart" class="chart-frame" style="height:380px;margin-bottom:1rem"></div>
                    <div class="hls-table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>stream</th><th>#</th><th>时长(s)</th><th>大小</th>
                                    <th>V-PTS</th><th>V-DTS</th><th>A-PTS</th><th>A-DTS</th>
                                    <th>AVΔPTS</th><th>PAT/PMT/PES</th><th>切片 URI</th>
                                </tr>
                            </thead>
                            <tbody id="hlsSegBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/echarts_helpers.js"></script>
    <script>
        let currentTaskId = null;
        let currentTaskType = '';
        let currentData = null;
        let currentChartType = 'timestamp';
        let currentHlsChartType = 'hls-ts';
        let currentMediaFilter = 'all';
        const stoppingTasks = new Set();
        let chartRefreshInterval = null;

        function isHlsAnalysisMode(d) {
            if (currentTaskType === 'hls') return true;
            if (d && Array.isArray(d.hls_segments) && d.hls_segments.length > 0) return true;
            return false;
        }

        function setFlvChartVisible(show) {
            const tabs = document.getElementById('flvChartTabs');
            const chart = document.getElementById('mainChart');
            const meta = document.getElementById('metadataBox');
            const tbl = document.getElementById('chartTable');
            const hls = document.getElementById('hlsSection');
            if (tabs) tabs.style.display = show ? 'flex' : 'none';
            if (chart) chart.style.display = show ? 'block' : 'none';
            if (meta) meta.style.display = show ? 'block' : 'none';
            if (tbl && !show) tbl.style.display = 'none';
            if (hls) hls.style.display = show ? 'none' : 'block';
        }

        function fmt90kTick(v) {
            if (v === undefined || v === null || v < 0) return '-';
            const n = Number(v);
            if (!isFinite(n)) return '-';
            return n + ' (' + (n / 90000).toFixed(3) + 's)';
        }

        function fmtAvDiff90k(s) {
            if (!s || !s.av_diff_valid) return '-';
            const d = Number(s.av_diff_pts_90k);
            if (!isFinite(d)) return '-';
            return d + ' (' + (d / 90).toFixed(2) + 'ms)';
        }

        function renderHLSSegments(d) {
            const body = document.getElementById('hlsSegBody');
            const grid = document.getElementById('statsGrid');
            if (!body) return;
            const rows = (d && d.hls_segments) ? d.hls_segments : [];
            if (grid) {
                const streams = new Set();
                rows.forEach(function (x) { if (x.stream_id) streams.add(x.stream_id); });
                grid.style.display = 'grid';
                grid.innerHTML =
                    '<div class="stat-item"><div class="stat-value">' + rows.length + '</div><div class="stat-label">TS 切片数</div></div>' +
                    '<div class="stat-item"><div class="stat-value">' + streams.size + '</div><div class="stat-label">Media 路数</div></div>';
            }
            body.innerHTML = '';
            if (!rows.length) {
                const tr = document.createElement('tr');
                tr.innerHTML = '<td colspan="11" style="color:#78716c">暂无切片数据（任务刚启动或尚未拉到 .ts）。</td>';
                body.appendChild(tr);
                if (typeof renderHLSChart === 'function') {
                    renderHLSChart(currentHlsChartType, [], 'hlsMainChart');
                }
                return;
            }
            rows.forEach(function (s) {
                const tr = document.createElement('tr');
                const sid = (s.stream_id || '-').replace(/</g, '');
                const uri = (s.uri || '').replace(/</g, '');
                tr.innerHTML =
                    '<td title="' + sid + '">' + (sid.length > 28 ? sid.slice(0, 28) + '…' : sid) + '</td>' +
                    '<td>' + String(s.seq) + '</td>' +
                    '<td>' + (s.duration_sec != null ? Number(s.duration_sec).toFixed(3) : '-') + '</td>' +
                    '<td>' + (s.size_bytes != null ? s.size_bytes : '-') + '</td>' +
                    '<td>' + fmt90kTick(s.video_pts_first_90k) + ' → ' + fmt90kTick(s.video_pts_last_90k) + '</td>' +
                    '<td>' + fmt90kTick(s.video_dts_first_90k) + ' → ' + fmt90kTick(s.video_dts_last_90k) + '</td>' +
                    '<td>' + fmt90kTick(s.audio_pts_first_90k) + ' → ' + fmt90kTick(s.audio_pts_last_90k) + '</td>' +
                    '<td>' + fmt90kTick(s.audio_dts_first_90k) + ' → ' + fmt90kTick(s.audio_dts_last_90k) + '</td>' +
                    '<td>' + fmtAvDiff90k(s) + '</td>' +
                    '<td>' + (s.pat_count || 0) + '/' + (s.pmt_count || 0) + '/' + (s.pes_count || 0) + '<br/><span style="font-size:.65rem;color:#78716c">vPES ' + (s.video_pes || 0) + ' / aPES ' + (s.audio_pes || 0) + '</span></td>' +
                    '<td class="hls-uri">' + uri + '</td>';
                body.appendChild(tr);
            });
            if (typeof renderHLSChart === 'function') {
                renderHLSChart(currentHlsChartType, rows, 'hlsMainChart');
            }
        }

        function showHlsChart(type) {
            currentHlsChartType = type;
            document.querySelectorAll('#hlsChartTabs button[data-hls-chart]').forEach(function (b) {
                b.classList.toggle('active', b.getAttribute('data-hls-chart') === type);
            });
            if (currentData && isHlsAnalysisMode(currentData) && currentData.hls_segments) {
                renderHLSChart(type, currentData.hls_segments, 'hlsMainChart');
            }
        }

        const historySources = {
            diagnostic: { title: '排障采样', path: '/api/diagnostics/runs', rows: value => value || [] },
            realtime: { title: '实时分析', path: '/api/task/all', rows: value => value.tasks || [] },
            offline: { title: '离线解析', path: '/api/offline/tasks', rows: value => value.tasks || [] },
        };
        const historyStates = {
            queued: '排队中', pending: '待处理', running: '进行中', stopping: '正在停止',
            done: '已完成', stopped: '已停止', partial: '部分完成', failed: '失败',
            canceled: '已取消', cancelled: '已取消',
        };
        const historyActive = new Set(['queued', 'pending', 'running', 'stopping']);
        const historyErrors = new Set(['failed', 'partial']);
        const historyDate = new Intl.DateTimeFormat('zh-CN', {dateStyle: 'short', timeStyle: 'medium'});
        let historyRows = [], historyUnavailable = [], historyRequest = 0;

        function readableAddress(value) {
            if (!value) return '—';
            try {
                const url = new URL(value);
                url.username = url.password = url.search = url.hash = '';
                return url.href;
            } catch {
                return String(value);
            }
        }
        function putHistoryCell(row, text, className) {
            const cell = row.insertCell();
            cell.textContent = text;
            if (className) cell.className = className;
            return cell;
        }
        function historyButton(label, action, className = 'btn') {
            const button = document.createElement('button');
            button.type = 'button';
            button.textContent = label;
            button.className = className;
            button.addEventListener('click', action);
            return button;
        }
        function historyLink(label, path) {
            const link = document.createElement('a');
            link.className = 'btn secondary';
            link.textContent = label;
            link.href = path;
            return link;
        }
        function showHistory() {
            const source = document.getElementById('history-source').value;
            const filter = document.getElementById('history-state').value;
            const query = document.getElementById('history-query').value.trim().toLowerCase();
            const tbody = document.getElementById('taskBody');
            tbody.replaceChildren();
            let shown = 0;
            for (const {kind, task, date, input, format} of historyRows) {
                const state = task.status || '';
                if (source !== 'all' && source !== kind) continue;
                if (filter === 'active' && !historyActive.has(state)) continue;
                if (filter === 'finished' && historyActive.has(state)) continue;
                if (filter === 'error' && !historyErrors.has(state)) continue;
                if (query && !`${input} ${task.id} ${format}`.toLowerCase().includes(query)) continue;
                shown++;
                const row = tbody.insertRow();
                row.classList.toggle('active', kind === 'realtime' && task.id === currentTaskId);
                putHistoryCell(row, [historySources[kind].title, format].filter(Boolean).join(' · '));
                const context = putHistoryCell(row, input, 'history-input');
                const id = document.createElement('code');
                id.textContent = task.id;
                context.append(id);
                const status = document.createElement('span');
                status.className = `pill${historyStates[state] ? ' ' + state : ''}`;
                status.textContent = historyStates[state] || state || '未知';
                row.insertCell().append(status);
                putHistoryCell(row, Number.isFinite(date) ? historyDate.format(date) : '—');
                const actions = putHistoryCell(row, '', 'actions');
                const encodedID = encodeURIComponent(task.id);
                if (kind === 'diagnostic') {
                    actions.append(historyLink('查看记录', '/diagnostics#' + encodedID));
                } else if (kind === 'offline') {
                    actions.append(historyLink('查看解析', '/offline?task=' + encodedID));
                } else if (state === 'running') {
                    actions.append(historyButton('停止', () => stopTask(task.id), 'btn stop'));
                } else {
                    actions.append(historyButton('分析', () => analyzeTask(task.id, task.type)), historyLink('XLSX', '/api/task/' + encodedID + '/xlsx'));
                }
            }
            const empty = document.getElementById('emptyState');
            empty.textContent = historyRows.length ? '没有符合筛选条件的记录。' : '暂无历史记录。';
            empty.hidden = shown > 0 || (historyRows.length === 0 && historyUnavailable.length > 0);
            const available = historyUnavailable.length ? ` · 暂时无法读取${historyUnavailable.join('、')}` : '';
            document.getElementById('history-status').textContent = `显示 ${shown} 条，共 ${historyRows.length} 条${available}`;
        }
        async function loadAllTasks() {
            const refresh = document.getElementById('refresh-history');
            refresh.disabled = true;
            const request = ++historyRequest;
            const groups = Object.entries(historySources);
            const response = await Promise.allSettled(groups.map(async ([kind, source]) => {
                const res = await fetch(source.path, {cache: 'no-store'});
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return source.rows(await res.json()).filter(task => typeof task.id === 'string').map(task => ({
                    kind, task, date: Date.parse(task.start_time || task.created_at),
                    input: kind === 'offline' ? task.input_name || '—' : readableAddress(task.url || task.origin),
                    format: (task.type || task.protocol || task.mode || '').toUpperCase(),
                }));
            }));
            if (request !== historyRequest) return;
            historyUnavailable = [];
            historyRows = response.flatMap((group, index) => {
                if (group.status === 'fulfilled') return group.value;
                historyUnavailable.push(groups[index][1].title);
                return [];
            }).sort((a, b) => (b.date || 0) - (a.date || 0));
            refresh.disabled = false;
            showHistory();
        }

        async function stopTask(id) {
            if (stoppingTasks.has(id)) return;
            stoppingTasks.add(id);
            try {
                const res = await fetch('/api/task/' + id, { method: 'DELETE' });
                if (!res.ok) {
                    const text = await res.text();
                    throw new Error(text || ('HTTP ' + res.status));
                }
                if (currentTaskId === id) closeAnalysis();
                await loadAllTasks();
            } catch (e) {
                alert('Stop failed: ' + (e && e.message ? e.message : e));
            } finally {
                stoppingTasks.delete(id);
            }
        }
        
        async function analyzeTask(id, type) {
            if (typeof disposeMainChart === 'function') disposeMainChart();
            if (typeof disposeHLSChart === 'function') disposeHLSChart();
            currentTaskId = id;
            currentTaskType = type || '';
            document.getElementById('analysisSection').style.display = 'block';
            document.getElementById('currentTaskTitle').textContent = id.substring(5,15) + '...';
            await loadChartData();
            if (!isHlsAnalysisMode(currentData)) {
                showChart('timestamp');
            }
            loadAllTasks();
            document.getElementById('analysisSection').scrollIntoView({ behavior: 'smooth' });
            if (chartRefreshInterval) clearInterval(chartRefreshInterval);
            chartRefreshInterval = setInterval(loadChartData, 5000);
        }
        
        function closeAnalysis() {
            if (typeof disposeMainChart === 'function') disposeMainChart();
            if (typeof disposeHLSChart === 'function') disposeHLSChart();
            document.getElementById('analysisSection').style.display = 'none';
            if (chartRefreshInterval) clearInterval(chartRefreshInterval);
            chartRefreshInterval = null;
            currentTaskId = null;
            currentTaskType = '';
            loadAllTasks();
        }
        
        async function loadChartData() {
            if (!currentTaskId) return;
            const res = await fetch('/api/task/' + currentTaskId + '/data');
            const d = await res.json();
            currentData = d;
            if (isHlsAnalysisMode(d)) {
                setFlvChartVisible(false);
                renderHLSSegments(d);
            } else {
                setFlvChartVisible(true);
                updateStats(d);
                if (typeof renderClientChart === 'function' && currentData) {
                    renderClientChart(currentChartType, currentData, 'mainChart', currentMediaFilter);
                }
                updateChartTable(currentChartType);
            }
        }
        
        function updateStats(d) {
            function videoCodecName(v) {
                const m = {
                    '2': 'H.263',
                    '3': 'ScreenVideo',
                    '4': 'VP6',
                    '5': 'VP6A',
                    '6': 'ScreenVideo2',
                    '7': 'H.264/AVC',
                    '12': 'H.265/HEVC'
                };
                return m[String(v)] || (v ? ('Codec-' + v) : '-');
            }
            function audioCodecName(v) {
                const m = {
                    '2': 'MP3',
                    '7': 'G.711 A-Law',
                    '8': 'G.711 mu-Law',
                    '10': 'AAC',
                    '11': 'Speex',
                    '14': 'MP3-8k'
                };
                return m[String(v)] || (v ? ('Codec-' + v) : '-');
            }
            const intervals = d.iframe_intervals.filter(v => v > 0);
            const avgInt = intervals.length ? Math.round(intervals.reduce((a,b)=>a+b,0)/intervals.length) : 0;
            const avgGop = d.gop_sizes.length ? Math.round(d.gop_sizes.reduce((a,b)=>a+b,0)/d.gop_sizes.length) : 0;
            const iFrames = d.frame_types.filter(f=>f==='I').length;
            const pFrames = d.frame_types.filter(f=>f==='P').length;
            const bFrames = d.frame_types.filter(f=>f==='B').length;
            const stats = d.second_stats;
            const avgVbr = stats.length ? (stats.reduce((a,b)=>a+b.video_bitrate,0)/stats.length).toFixed(1) : 0;
            const avgAbr = stats.length ? (stats.reduce((a,b)=>a+b.audio_bitrate,0)/stats.length).toFixed(1) : 0;
            const avgVfps = stats.length ? Math.round(stats.reduce((a,b)=>a+b.video_fps,0)/stats.length) : 0;
            const avgAfps = stats.length ? Math.round(stats.reduce((a,b)=>a+b.audio_fps,0)/stats.length) : 0;
            const codecFps = d.video_frame_rate && d.video_frame_rate > 0 ? d.video_frame_rate.toFixed(3) : '-';
            const videoCodec = videoCodecName(d.video_codec);
            const audioCodec = audioCodecName(d.audio_codec);
            const resolution = (d.video_width > 0 && d.video_height > 0) ? (d.video_width + 'x' + d.video_height) : '-';
            const sampleRate = d.sample_rate > 0 ? d.sample_rate : '-';
            const channels = d.channels > 0 ? d.channels : '-';
            
            document.getElementById('statsGrid').innerHTML =
                '<div class="stat-item"><div class="stat-value">'+d.frame_types.length+'</div><div class="stat-label">总帧数</div></div>'+
                '<div class="stat-item"><div class="stat-value">'+iFrames+'/'+pFrames+'/'+bFrames+'</div><div class="stat-label">I/P/B帧</div></div>'+
                '<div class="stat-item"><div class="stat-value">'+avgInt+'</div><div class="stat-label">I帧间隔</div></div>'+
                '<div class="stat-item"><div class="stat-value">'+avgGop+'</div><div class="stat-label">GOP大小</div></div>'+
                '<div class="stat-item"><div class="stat-value">'+avgVbr+'</div><div class="stat-label">视频码率</div></div>'+
                '<div class="stat-item"><div class="stat-value">'+avgAbr+'</div><div class="stat-label">音频码率</div></div>'+
                '<div class="stat-item"><div class="stat-value">'+avgVfps+'</div><div class="stat-label">视频FPS</div></div>'+
                '<div class="stat-item"><div class="stat-value">'+avgAfps+'</div><div class="stat-label">音频FPS</div></div>'+
                '<div class="stat-item"><div class="stat-value">'+codecFps+'</div><div class="stat-label">编码帧率</div></div>'+
                '<div class="stat-item"><div class="stat-value">'+videoCodec+'</div><div class="stat-label">视频编码</div></div>'+
                '<div class="stat-item"><div class="stat-value">'+audioCodec+'</div><div class="stat-label">音频编码</div></div>'+
                '<div class="stat-item"><div class="stat-value">'+resolution+'</div><div class="stat-label">分辨率</div></div>'+
                '<div class="stat-item"><div class="stat-value">'+sampleRate+'</div><div class="stat-label">采样率</div></div>'+
                '<div class="stat-item"><div class="stat-value">'+channels+'</div><div class="stat-label">声道数</div></div>'+
                '<div class="stat-item"><div class="stat-value">'+stats.length+'</div><div class="stat-label">时长(s)</div></div>';

            const metadataBox = document.getElementById('metadataBox');
            if (metadataBox) {
                if (d.metadata_json) {
                    try {
                        metadataBox.textContent = JSON.stringify(JSON.parse(d.metadata_json), null, 2);
                    } catch (_) {
                        metadataBox.textContent = d.metadata_json;
                    }
                } else {
                    metadataBox.textContent = 'metadata: -';
                }
            }
        }
        
        function setMediaFilter(filter) {
            currentMediaFilter = filter;
            document.querySelectorAll('#mediaFilterTabs button[data-filter]').forEach(function(b) {
                b.classList.toggle('active', b.getAttribute('data-filter') === filter);
            });
            if (currentData && !isHlsAnalysisMode(currentData)) {
                if (typeof renderClientChart === 'function') renderClientChart(currentChartType, currentData, 'mainChart', currentMediaFilter);
                updateChartTable(currentChartType);
            }
        }

        function showChart(type) {
            if (isHlsAnalysisMode(currentData)) return;
            currentChartType = type;
            document.querySelectorAll('#flvChartTabs button[data-chart]').forEach(function(b) {
                b.classList.toggle('active', b.getAttribute('data-chart') === type);
            });
            if (currentData && typeof renderClientChart === 'function') {
                renderClientChart(type, currentData, 'mainChart', currentMediaFilter);
            }
            updateChartTable(type);
        }
        
        function updateChartTable(type) {
            if (!currentData || isHlsAnalysisMode(currentData)) return;
            const d = currentData;
            const filter = currentMediaFilter || 'all';
            const tableDiv = document.getElementById('chartTable');
            const thead = document.getElementById('tableHead');
            const tbody = document.getElementById('tableBody');
            let headers = '';
            let rows = '';
            const stats = d.second_stats || [];
            const maxRows = Number.MAX_SAFE_INTEGER;
            const displayStats = stats;
            const formatTime = (sec) => {
                const dd = new Date(Number(sec) * 1000);
                if (Number.isNaN(dd.getTime())) return '-';
                const pad = (n) => String(n).padStart(2, '0');
                return dd.getFullYear() + '-' + pad(dd.getMonth() + 1) + '-' + pad(dd.getDate()) + ' ' +
                    pad(dd.getHours()) + ':' + pad(dd.getMinutes()) + ':' + pad(dd.getSeconds());
            };
            const startSecond = displayStats.length > 0 ? Number(displayStats[0].second) : 0;
            switch(type) {
                case 'timestamp': {
                    tableDiv.style.display='block';
                    const vts=d.video_dts||[], vpts=d.video_pts||[], ats=d.audio_dts||[], vcts=d.video_cts||[];
                    let h='<tr><th>时间戳</th>';
                    if(filter==='all'||filter==='video') h+='<th class="video">视频DTS</th><th class="video">视频PTS</th><th class="video">视频CTS</th>';
                    if(filter==='all'||filter==='audio') h+='<th class="audio">音频DTS</th>';
                    h+='</tr>';
                    headers=h;
                    const allTsSet=new Set([]);
                    if(filter==='all'||filter==='video') { vts.forEach(v=>allTsSet.add(v)); vpts.forEach(v=>allTsSet.add(v)); }
                    if(filter==='all'||filter==='audio') { ats.forEach(v=>allTsSet.add(v)); }
                    const allTs=Array.from(allTsSet).filter(v=>v!==null&&v!==undefined&&v!=='').sort((a,b)=>Number(a)-Number(b)).slice(0,maxRows);
                    const hasNum=(arr,x)=>arr.some(v=>Number(v)===Number(x));
                    for(let i=0;i<allTs.length;i++){
                        const t=allTs[i];
                        let r='<tr><td>'+t+'</td>';
                        if(filter==='all'||filter==='video'){
                            const ctsIdx=vts.indexOf(Number(t));
                            r+='<td>'+(hasNum(vts,t)?t:'-')+'</td><td>'+(hasNum(vpts,t)?t:'-')+'</td><td>'+(ctsIdx>=0&&vcts[ctsIdx]!=null?vcts[ctsIdx]:'-')+'</td>';
                        }
                        if(filter==='all'||filter==='audio') r+='<td>'+(hasNum(ats,t)?t:'-')+'</td>';
                        r+='</tr>';
                        rows+=r;
                    }
                    break;
                }
                case 'length':
                    tableDiv.style.display='block';
                    headers='<tr><th>#</th>'+(filter==='all'||filter==='video'?'<th class="video">视频长度</th>':'')+(filter==='all'||filter==='audio'?'<th class="audio">音频长度</th>':'')+'</tr>';
                    const vls=d.video_lens||[], als=d.audio_lens||[];
                    const lsLen=Math.min((filter==='all'?Math.max(vls.length,als.length):(filter==='video'?vls.length:als.length)),maxRows);
                    for(let i=0;i<lsLen;i++){
                        rows+='<tr><td>'+(i+1)+'</td>';
                        if(filter==='all'||filter==='video') rows+='<td>'+(vls[i]||'-')+'</td>';
                        if(filter==='all'||filter==='audio') rows+='<td>'+(als[i]||'-')+'</td>';
                        rows+='</tr>';
                    }
                    break;
                case 'iframe':
                    tableDiv.style.display='block';
                    if(filter==='audio'){headers='<tr><th>#</th><th>I帧间隔</th></tr>';rows='<tr><td colspan="2">音频无 I 帧间隔数据</td></tr>';break;}
                    headers='<tr><th>#</th><th class="video">I帧间隔</th></tr>';
                    const iframes=(d.iframe_intervals||[]).filter(v=>v>0).slice(0,maxRows);
                    for(let i=0;i<iframes.length;i++){rows+='<tr><td>'+(i+1)+'</td><td>'+iframes[i]+'</td></tr>';}
                    break;
                case 'gop':
                    tableDiv.style.display='block';
                    if(filter==='audio'){headers='<tr><th>#</th><th>GOP大小</th></tr>';rows='<tr><td colspan="2">音频无 GOP 数据</td></tr>';break;}
                    headers='<tr><th>#</th><th class="video">GOP大小</th></tr>';
                    const gops=(d.gop_sizes||[]).slice(0,maxRows);
                    for(let i=0;i<gops.length;i++){rows+='<tr><td>'+(i+1)+'</td><td>'+gops[i]+'</td></tr>';}
                    break;
                case 'bitrate':
                    tableDiv.style.display='block';
                    headers='<tr><th>时间</th>'+(filter==='all'||filter==='video'?'<th class="video">视频码率</th>':'')+(filter==='all'||filter==='audio'?'<th class="audio">音频码率</th>':'')+'</tr>';
                    for(let i=0;i<displayStats.length;i++){const s=displayStats[i];const rel=Number(s.second)-startSecond;rows+='<tr><td>T+'+rel+'s<br/>'+formatTime(s.second)+'</td>'+(filter==='all'||filter==='video'?'<td>'+s.video_bitrate.toFixed(1)+'</td>':'')+(filter==='all'||filter==='audio'?'<td>'+s.audio_bitrate.toFixed(1)+'</td>':'')+'</tr>';}
                    break;
                case 'fps':
                    tableDiv.style.display='block';
                    headers='<tr><th>时间</th>'+(filter==='all'||filter==='video'?'<th class="video">视频FPS</th>':'')+(filter==='all'||filter==='audio'?'<th class="audio">音频FPS</th>':'')+'</tr>';
                    for(let i=0;i<displayStats.length;i++){const s=displayStats[i];const rel=Number(s.second)-startSecond;rows+='<tr><td>T+'+rel+'s<br/>'+formatTime(s.second)+'</td>'+(filter==='all'||filter==='video'?'<td>'+s.video_fps+'</td>':'')+(filter==='all'||filter==='audio'?'<td>'+s.audio_fps+'</td>':'')+'</tr>';}
                    break;
                case 'avsync':
                    tableDiv.style.display='block';
                    if(filter!=='all'){headers='<tr><th>视频DTS</th><th>最近音频DTS</th><th>偏差</th></tr>';rows='<tr><td colspan="3">AV 同步需在“全部”模式下查看</td></tr>';break;}
                    headers='<tr><th>视频DTS</th><th class="audio">最近音频DTS</th><th>偏差</th></tr>';
                    const avVts=(d.video_dts||[]).map(Number).filter(v=>!Number.isNaN(v));
                    const avAts=(d.audio_dts||[]).map(Number).filter(v=>!Number.isNaN(v));
                    if(avVts.length===0||avAts.length===0){rows='<tr><td colspan="3">暂无可计算的 AV 时间戳数据</td></tr>';break;}
                    let ai=0;
                    for(let i=0;i<Math.min(avVts.length,maxRows);i++){const ts=avVts[i];while(ai+1<avAts.length&&Math.abs(avAts[ai+1]-ts)<=Math.abs(avAts[ai]-ts))ai++;const nearest=avAts[ai];const diff=ts-nearest;rows+='<tr><td>'+ts+'</td><td>'+nearest+'</td><td>'+diff+'</td></tr>';}
                    break;
                default:
                    tableDiv.style.display='none';
                    return;
            }
            thead.innerHTML = headers;
            tbody.innerHTML = rows;
        }
        
        function downloadXLSX() {
            if (currentTaskId) window.location.href = '/api/task/' + currentTaskId + '/xlsx';
        }
        
        function downloadXLSXById(id) {
            window.location.href = '/api/task/' + id + '/xlsx';
        }
        
        const filters = document.getElementById('history-filters');
        filters.addEventListener('submit', event => event.preventDefault());
        filters.addEventListener('input', showHistory);
        document.getElementById('refresh-history').addEventListener('click', loadAllTasks);
        loadAllTasks();
    </script>
</body>
