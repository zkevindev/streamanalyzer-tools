<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stream Analyzer · 首页</title>
  <link rel="stylesheet" href="/static/workbench-theme.css">
  <link rel="stylesheet" href="/static/home.css">
  <script src="/static/workbench-navigation.js" defer></script>
</head>
<body class="home">
  <!-- workbench-header -->

  <main class="home-width home-main">
    <section class="home-hero" aria-labelledby="home-title">
      <div class="home-intro">
        <h1 id="home-title">流媒体排障与协议联调</h1>
        <p>从线上采样到本地复盘，查看码流、请求时序与播放器体验。</p>
        <div class="home-signal" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      </div>
      <nav class="home-workflows" aria-label="主要工具">
        <a class="home-workflow home-workflow-primary" href="/diagnostics">
          <span class="home-tool-copy">
            <strong>排障工作台</strong>
            <span>采集真实流、探测 ONVIF 设备并生成证据报告</span>
          </span>
          <span class="home-arrow" aria-hidden="true">→</span>
        </a>
        <a class="home-workflow" href="/simulators">
          <span class="home-tool-copy">
            <strong>模拟器</strong>
            <span>模拟 GB28181、ONVIF、SIP 等协议，复现场景</span>
          </span>
          <span class="home-arrow" aria-hidden="true">→</span>
        </a>
      </nav>
    </section>

    <section class="home-analysis" aria-labelledby="analysis-title">
      <h2 id="analysis-title">分析与回看</h2>
      <ul class="home-tool-list">
        <li>
          <a href="/realtime">
            <span class="home-tool-copy"><strong>实时曲线</strong><span>查看直播码率、帧率与 PTS／DTS</span></span>
            <span class="home-arrow" aria-hidden="true">→</span>
          </a>
        </li>
        <li>
          <a href="/diagnostics/review">
            <span class="home-tool-copy"><strong>离线复盘</strong><span>导入证据包，或解析抓包及媒体文件</span></span>
            <span class="home-arrow" aria-hidden="true">→</span>
          </a>
        </li>
        <li>
          <a href="/hls-stats">
            <span class="home-tool-copy"><strong>HLS 交付</strong><span>检查播放列表、分片耗时与缓存命中</span></span>
            <span class="home-arrow" aria-hidden="true">→</span>
          </a>
        </li>
        <li>
          <a href="/history">
            <span class="home-tool-copy"><strong>任务记录</strong><span>回看排障、分析与模拟器回归结果</span></span>
            <span class="home-arrow" aria-hidden="true">→</span>
          </a>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
