<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RTMP／RTMPS 模拟器 · Stream Analyzer</title>
  <link rel="stylesheet" href="/static/workbench-theme.css">
  <link rel="stylesheet" href="/static/diagnostics.css">
  <link rel="stylesheet" href="/static/simulators.css">
  <script src="/static/simulator-rtmp.js" defer></script>
  <script src="/static/workbench-navigation.js" defer></script>
</head>
<body class="simulator-page simulator-rtmp-page">
  <!-- workbench-header -->
  <main id="main" tabindex="-1">
    <!-- simulator-protocols -->
    <div class="page-heading"><div><h1>RTMP／RTMPS 模拟器</h1><p class="muted">在本机逐阶段复现拉流失败。</p></div></div>
    <p id="notice" class="error" role="alert" hidden></p>
    <div class="simulator-grid">
      <section class="panel">
        <div class="panel-heading"><h2>推流与拉流场景</h2></div>
        <form id="form" class="panel-body">
          <fieldset id="config" disabled>
            <div class="sim-fields">
              <div><label for="fault">场景</label><select id="fault">
                <option value="normal">正常 RTMP 音视频</option>
                <option value="tls_untrusted">RTMPS 证书不受信</option>
                <option value="handshake_stall">RTMP 握手停住</option>
                <option value="app_reject">应用拒绝连接</option>
                <option value="stream_not_found">找不到流</option>
                <option value="no_media">播放协商成功但无媒体</option>
                <option value="publish_relay">接收本机推流并转发</option>
                <option value="publish_failover">主路停发后备路接管</option>
              </select></div>
              <div id="stall-track-field" hidden><label for="stall-track">停发判定</label><select id="stall-track"><option value="">全部音视频停发</option><option value="video">仅判断视频停发</option></select></div>
              <div id="primary-stall-field" hidden><label for="primary-stall">主路停发阈值（毫秒）</label><input id="primary-stall" type="number" min="500" max="10000" value="1500" required></div>
              <div id="primary-stable-field" hidden><label for="primary-stable">主路稳定后回切（毫秒，0 关闭）</label><input id="primary-stable" type="number" min="0" max="30000" value="0" required></div>
              <div id="keyframe-field" hidden><label for="keyframe-delay">延迟首个可转发关键帧（毫秒）</label><input id="keyframe-delay" type="number" min="0" max="15000" value="0" required></div>
              <div><label for="port">本机端口</label><input id="port" type="number" min="0" max="65535" value="0" required></div>
            </div>
          </fieldset>
          <div class="sim-controls"><button id="start" disabled>启动媒体源</button><button id="stop" type="button" class="secondary" disabled>停止</button></div>
        </form>
      </section>
      <section class="panel">
        <div class="panel-heading"><h2>源站状态</h2><span id="state" class="status" role="status">正在读取</span></div>
        <div class="panel-body">
          <dl class="metrics sim-metrics">
            <div><dt>TCP 接入</dt><dd id="connections">0</dd></div>
            <div><dt>PLAY 成功</dt><dd id="plays">0</dd></div>
            <div><dt>故障触发</dt><dd id="hits">0</dd></div>
          </dl>
          <dl class="onvif-addresses"><div><dt>播放地址</dt><dd id="url">—</dd></div><div><dt>最近阶段</dt><dd id="stage">—</dd></div></dl>
          <div id="ingest" hidden>
            <p class="field-hint">FFmpeg 可推送到同一地址。OBS 的服务器填写 <code id="ingest-server"></code>，串流密钥填 <code>test</code>。</p>
            <p id="backup-status" class="field-hint" hidden></p>
            <p id="primary-tracks" class="field-hint" hidden></p>
            <ol id="switch-list" class="session-timeline" hidden></ol>
            <p id="ingest-status" class="field-hint"></p>
            <ol id="publication-list" class="session-timeline"></ol>
          </div>
          <div class="sim-controls"><a class="button" id="open" href="/diagnostics?rtmp_simulator=1" hidden>打开排障工作台</a></div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
