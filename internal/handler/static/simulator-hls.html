<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HLS 故障源模拟器 · Stream Analyzer</title>
  <link rel="stylesheet" href="/static/workbench-theme.css">
  <link rel="stylesheet" href="/static/diagnostics.css">
  <link rel="stylesheet" href="/static/simulators.css">
  <script src="/static/simulator-hls.js" defer></script>
  <script src="/static/workbench-navigation.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">跳转到主要内容</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="/"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>Stream Analyzer</a>
      <nav aria-label="主导航">
        <a href="/diagnostics">排障工作台</a>
        <a href="/simulators" aria-current="page">模拟器</a>
        <a href="/realtime?protocol=rtmp">RTMP 实时分析</a>
        <a href="/hls-stats">HLS 分析</a>
      </nav>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <nav class="simulator-protocols" aria-label="模拟协议">
      <a href="/simulators">GB28181</a>
      <a href="/simulators/onvif">ONVIF</a>
      <a href="/simulators/sip">通用 SIP</a>
      <a href="/simulators/hls" aria-current="page">HLS</a>
      <a href="/simulators/media">HTTP-FLV / MPEG-TS</a>
      <a href="/simulators/scenarios">场景回归</a>
      <a href="/simulators/whep">WHEP</a>
    </nav>
    <div class="page-heading">
      <div><h1>HLS 故障源模拟器</h1><p class="muted">用可重复的分片故障验证播放器卡顿与请求证据。</p></div>
    </div>
    <p id="notice" class="error" role="alert" hidden></p>
    <div class="simulator-grid">
      <section class="panel" aria-labelledby="config-title">
        <div class="panel-heading"><h2 id="config-title">播放场景</h2></div>
        <form id="hls-form" class="panel-body">
          <fieldset id="simulator-fields" disabled>
            <label for="mode">场景</label>
            <select id="mode" name="mode"><option value="normal">正常点播</option><option value="live">滚动直播</option><option value="stale">直播列表回退</option><option value="key_rotation">AES-128 密钥轮换</option><option value="key_forbidden">轮换后新密钥返回 403</option><option value="abr">双码率 fMP4 直播</option><option value="audio">独立音轨分片故障</option><option value="audio_boundary">独立音轨跨段错位</option><option value="ll">低延迟直播 / Part 延迟</option><option value="delay">分片延迟</option><option value="not_found">分片返回 404</option></select>
            <div class="sim-fields">
              <div id="segment-field" hidden><label for="segment">分片序号</label><input id="segment" name="segment" type="number" value="4" min="1" max="12" required></div>
              <div id="delay-field" hidden><label for="delay-ms">延迟（毫秒）</label><input id="delay-ms" name="delay_ms" type="number" value="10000" min="500" max="15000" required></div>
            </div>
          </fieldset>
          <p class="muted field-hint">内置 24 秒测试画面，含 12 个 2 秒分片。</p>
          <div class="sim-controls sip-metrics"><button id="start" type="submit" disabled>启动故障源</button><button id="stop" type="button" class="secondary" disabled>停止</button></div>
        </form>
      </section>
      <section class="panel" aria-labelledby="status-title">
        <div class="panel-heading"><h2 id="status-title">源站状态</h2><span id="state" class="status" role="status">正在读取</span></div>
        <div class="panel-body">
          <dl class="metrics sim-metrics">
            <div><dt>分片 GET 请求</dt><dd id="requests">0</dd></div>
            <div><dt>故障触发</dt><dd id="faults">0</dd></div>
          </dl>
          <dl class="onvif-addresses" id="source-info" hidden>
            <div><dt>场景</dt><dd id="scenario"></dd></div>
            <div><dt>最近触发时间</dt><dd id="last-fault"></dd></div>
            <div><dt>播放列表地址</dt><dd id="playlist"></dd></div>
          </dl>
          <p id="live-summary" class="field-hint" hidden></p>
          <ol id="playlist-samples" class="sim-events" hidden></ol>
          <form id="part-fault-form" hidden>
                <div class="sim-fields"><div><label for="part-delay-ms">Part 延迟（毫秒）</label>
                  <input id="part-delay-ms" type="number" min="400" max="3000" value="1800" required></div>
                  <div><button id="arm-part" class="secondary">安排下一次 Part 延迟</button></div>
                </div>
            </form>
            <p id="ll-observation" class="muted field-hint" hidden></p>
            <form id="live-fault-form" hidden>
            <fieldset id="live-fault-fields" disabled>
              <div class="sim-fields">
                <div><label for="live-fault-kind">直播分片故障</label><select id="live-fault-kind"><option value="not_found">首次 404</option><option value="truncate">首次正文中断（HTTP 200）</option></select></div>
                <div><label for="live-fault-seq">目标媒体序号</label><input id="live-fault-seq" type="number" min="1" placeholder="下一发布分片"></div>
                <div><label for="live-fault-audience">触发请求</label><select id="live-fault-audience"><option value="player">工作台实际播放</option><option value="all">全部客户端</option></select></div>
              </div>
              <div class="sim-controls"><button type="submit" class="secondary">安排一次故障</button></div>
            </fieldset>
          </form>
          <p id="key-observation" class="field-hint" hidden></p>
          <p id="live-fault-status" class="field-hint" hidden></p>
          <div class="sim-controls sip-metrics" id="actions" hidden>
            <button id="key-restore" type="button" class="secondary" hidden>恢复新密钥</button>
            <button id="freeze" type="button" class="secondary" hidden>冻结播放列表</button>
            <a id="open-workbench" class="button">打开排障工作台</a>
            <a id="open-recovery" class="button secondary" hidden>测试播放器重试</a>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
