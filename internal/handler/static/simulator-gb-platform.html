<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GB28181 平台侧收流 · Stream Analyzer</title>
  <link rel="stylesheet" href="/static/workbench-theme.css">
  <link rel="stylesheet" href="/static/diagnostics.css">
  <link rel="stylesheet" href="/static/simulators.css">
  <script src="/static/simulator-gb-platform.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">跳转到主要内容</a>
  <header class="topbar"><div class="topbar-inner">
    <a class="wordmark" href="/"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>Stream Analyzer</a>
    <nav aria-label="主导航"><a href="/diagnostics">排障工作台</a><a href="/simulators" aria-current="page">模拟器</a></nav>
  </div></header>
  <main id="main" tabindex="-1">
    <div class="page-heading"><div><h1>GB28181 平台侧收流</h1><a href="/simulators">返回 GB28181 设备模拟器</a></div></div>
    <p id="notice" class="error" role="alert" hidden></p>
    <div class="simulator-grid">
      <section class="panel">
        <div class="panel-heading"><h2>平台接入</h2></div>
        <div class="panel-body">
          <form id="start-form">
            <fieldset id="platform-config" disabled>
              <div class="sim-fields">
                <div><label for="ip">本机 IPv4</label><input id="ip" name="ip" value="127.0.0.1" required></div>
                <div><label for="port">SIP 端口</label><input id="port" name="port" type="number" min="0" max="65535" value="0"></div>
                <div><label for="sip-transport">SIP 传输</label><select id="sip-transport" name="sip_transport"><option value="udp">UDP</option><option value="tcp">TCP</option></select></div>
                <div><label for="platform-id">平台编号</label><input id="platform-id" name="platform_id" pattern="[0-9]{20}" value="34020000002000000001" required></div>
                <div><label for="device-id">设备编号</label><input id="device-id" name="device_id" pattern="[0-9]{20}" value="34020000001320000001" required></div>
              </div>
              <label for="extra-devices">其他设备编号</label>
              <textarea id="extra-devices" rows="2" maxlength="336" placeholder="每行一个 20 位设备编号"></textarea>
            </fieldset>
            <div class="sim-controls"><button id="start" disabled>启动平台</button><button type="button" id="stop" class="secondary" disabled>停止平台</button></div>
          </form>
          <p class="muted field-hint">将设备的 SIP 平台地址填为下方实际监听地址，使用与测试平台相同的 SIP 传输，密码留空。</p>
          <dl class="onvif-addresses">
            <div><dt>监听地址</dt><dd id="address">—</dd></div>
            <div><dt>已注册设备</dt><dd id="peer">—</dd></div>
          </dl>
          <label for="preview-device">点播与报告所选设备</label>
          <select id="preview-device" disabled></select>
          <form id="preview-form">
            <fieldset id="preview-config" disabled>
              <div class="sim-fields">
                <div><label for="channel">通道编号</label><input id="channel" name="channel_id" pattern="[0-9]{20}" value="34020000001320000002" required></div>
                <div><label for="media-transport">点播媒体传输</label><select id="media-transport" name="media_transport"><option value="udp">UDP</option><option value="tcp-active">TCP（平台主动连接）</option><option value="tcp-passive">TCP（平台等待连入）</option></select></div>
                <div><label for="recovery-mode">恢复场景</label><select id="recovery-mode" name="recovery"><option value="">常规点播</option><option value="media_rtp_timeout">在线断流后恢复点播</option><option value="sip_tcp_disconnect" data-transport="tcp">收到关键帧后断开 SIP TCP</option><option value="udp_keepalive_timeout" data-transport="udp">收到关键帧后忽略 UDP 心跳</option></select></div>
                <div><label for="window">观测窗口（毫秒）</label><input id="window" name="window_ms" type="number" min="500" max="15000" value="4000" required></div>
              </div>
              <label class="sim-check"><input id="recording-mode" type="checkbox"> 检索指定时段并回放录像</label>
              <div class="sim-fields" id="recording-range" hidden>
                <div><label for="recording-start">录像开始（本地时间）</label><input id="recording-start" type="datetime-local" step="1"></div>
                <div><label for="recording-end">录像结束（本地时间）</label><input id="recording-end" type="datetime-local" step="1"></div>
              </div>
              <p id="recovery-hint" class="muted field-hint" hidden>UDP 场景使用 5 秒设备心跳，最多等待 30 秒重新注册。</p>
              <label class="sim-check"><input id="skip-ack" type="checkbox"> 观测窗口内暂缓 ACK</label>
              <label id="skip-connect-control" class="sim-check" hidden><input id="skip-connect" type="checkbox"> 观测窗口内暂缓平台侧 TCP 建连</label>
              <div class="sim-controls"><button id="preview-submit">点播并收流</button></div>
            </fieldset>
          </form>
        </div>
      </section>
      <section class="panel">
        <div class="panel-heading"><h2>点播结果</h2><span id="result" class="status" role="status">等待点播</span></div>
        <div class="panel-body">
          <p id="recovery-result" class="field-hint" hidden></p>
          <p id="recording-summary" class="field-hint" hidden></p>
          <ul id="recording-list" hidden></ul>
          <fieldset id="recording-controls" hidden>
            <div class="sim-controls">
              <button type="button" id="recording-pause" class="secondary">暂停</button>
              <button type="button" id="recording-resume" class="secondary">继续</button>
              <label for="recording-offset">定位秒数</label><input id="recording-offset" type="number" min="0" step="0.001" value="0">
              <button type="button" id="recording-seek" class="secondary">定位并继续</button>
            </div>
          </fieldset>
          <p id="detail" class="field-hint" hidden></p>
          <dl id="stats" class="metrics sim-metrics" hidden>
            <div><dt>收到 RTP</dt><dd id="rtp">0</dd></div>
            <div><dt>完整 PS 单元</dt><dd id="ps">0</dd></div>
            <div><dt>关键帧</dt><dd id="keys">0</dd></div>
          </dl>
          <p id="dialog-id" class="muted field-hint" hidden></p>
          <ol id="timeline" class="session-timeline" hidden></ol>
          <a id="export" class="button secondary" href="/api/simulators/gb28181/platform/trace.json" hidden>导出点播证据</a>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
