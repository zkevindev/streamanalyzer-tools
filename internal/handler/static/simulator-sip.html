<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>通用 SIP 模拟器 · Stream Analyzer</title>
  <link rel="stylesheet" href="/static/workbench-theme.css">
  <link rel="stylesheet" href="/static/diagnostics.css">
  <link rel="stylesheet" href="/static/simulators.css">
  <script src="/static/simulator-sip.js" defer></script>
  <script src="/static/workbench-navigation.js" defer></script>
</head>
<body class="simulator-page simulator-sip-page">
  <!-- workbench-header -->
  <main id="main" tabindex="-1">
    <!-- simulator-protocols -->
    <div class="page-heading">
      <div>
        <h1>通用 SIP 模拟器</h1>
        <p class="muted">注册 SIP 分机，验证呼入、呼出和双向 G.711 音频。</p>
      </div>
    </div>
    <p id="notice" class="error" role="alert" hidden></p>
    <div class="simulator-grid">
      <section class="panel" aria-labelledby="registration-title">
        <div class="panel-heading">
          <h2 id="registration-title">SIP 注册</h2>
          <span id="registration-state" class="status" role="status">正在读取</span>
        </div>
        <form id="registration-form" class="panel-body" autocomplete="off">
          <fieldset id="simulator-fields" disabled>
            <div class="sim-fields">
              <div><label for="sip-host">服务器地址</label><input id="sip-host" name="host" placeholder="IPv4 或主机名" maxlength="253" required></div>
              <div><label for="sip-transport">SIP 信令传输</label><select id="sip-transport" name="transport"><option value="udp">UDP</option><option value="tcp">TCP</option><option value="tls">TLS</option></select></div>
              <div><label for="sip-port">服务器端口</label><input id="sip-port" name="port" type="number" min="1" max="65535" value="5060" required></div>
              <div><label for="sip-user">分机号</label><input id="sip-user" name="user" maxlength="96" required></div>
              <div><label for="sip-domain">SIP 域</label><input id="sip-domain" name="domain" maxlength="253" placeholder="默认使用服务器地址"></div>
              <div><label for="sip-username">Digest 用户名</label><input id="sip-username" name="username" placeholder="默认使用分机号" maxlength="128"></div>
              <div><label for="sip-password">密码</label><input id="sip-password" name="password" type="password" maxlength="1024" autocomplete="new-password"></div>
            </div>
            <details id="tls-settings" class="sim-advanced" hidden>
              <summary>TLS 证书验证</summary>
              <div><label for="sip-tls-name">证书主机名</label><input id="sip-tls-name" name="tls_server_name" maxlength="253" placeholder="默认使用服务器地址"></div>
              <div><label for="sip-tls-ca">附加受信 CA（PEM）</label><textarea id="sip-tls-ca" name="tls_ca_pem" maxlength="32768" rows="3"></textarea></div>
            </details>
            <details class="sim-advanced">
              <summary>本机信令地址</summary>
              <div class="sim-fields">
                <div><label for="sip-local-ip">本机 IPv4 地址</label><input id="sip-local-ip" name="local_ip" maxlength="15" placeholder="按服务器路由自动选择"></div>
                <div><label for="sip-local-port">本机信令端口</label><input id="sip-local-port" name="local_port" type="number" min="0" max="65535" value="0"></div>
              </div>
            </details>
            <details class="sim-advanced">
              <summary>通话场景预设</summary>
              <label for="preset">每次接通后执行</label>
              <select id="preset" name="preset">
                <option value="">手动操作</option>
                <option value="one-way-send">发送单向无声并恢复</option>
              </select>
              <div class="sim-fields" id="preset-times" hidden>
                <div><label for="preset-delay">接通后（毫秒）</label><input id="preset-delay" name="preset_delay_ms" type="number" min="200" max="30000" value="3000"></div>
                <div><label for="preset-duration">故障持续（毫秒）</label><input id="preset-duration" name="preset_duration_ms" type="number" min="300" max="30000" value="5000"></div>
              </div>
            </details>
            <div><label for="rtp-return">RTP 回包目的地</label>
              <select id="rtp-return" name="rtp_return"><option value="sdp">对端 SDP 地址</option><option value="source">首个有效 RTP 的来源地址</option></select>
            </div>
            <label class="sim-check"><input id="simulate-nat-port" type="checkbox"> 本机 RTP 使用不同于 SDP 声明的端口</label>
            <label class="sim-check"><input id="offer-reliable" type="checkbox"> 对支持 100rel 的呼入等待 PRACK</label>
            <label class="sim-check"><input id="offer-early" type="checkbox"> 呼入振铃时发送 183 和早期测试音</label>
            <div class="sim-fields">
              <div><label for="session-timer">SIP 会话刷新</label><select id="session-timer" name="session_timer"><option value="">关闭</option><option value="normal">正常 UPDATE</option><option value="reject">拒绝对端 UPDATE</option><option value="timeout">忽略对端 UPDATE</option></select></div>
              <div><label for="session-seconds">最短周期（秒）</label><input id="session-seconds" name="session_seconds" type="number" min="2" max="3600" value="90" required></div>
            </div>
          </fieldset>
          <div class="sim-controls">
            <button id="register" type="submit" disabled>注册分机</button>
            <button id="unregister" class="secondary" type="button" disabled>停止并注销</button>
          </div>
          <dl id="sip-addresses" class="onvif-addresses" hidden>
            <div><dt>本机信令</dt><dd id="signal-local"></dd></div>
            <div><dt>服务器</dt><dd id="signal-peer"></dd></div>
          </dl>
          <p id="sip-stage" class="field-hint" hidden></p>
          <p id="sip-reconnect" class="field-hint" hidden></p>
        <p id="registration-error" class="sim-error" hidden></p>
        </form>
      </section>
      <section class="panel" aria-labelledby="call-title">
        <div class="panel-heading">
          <h2 id="call-title">通话</h2>
          <span id="call-state" class="status" role="status">空闲</span>
        </div>
        <div class="panel-body">
          <p id="session-timer-status" class="field-hint" hidden></p>
          <form id="call-form" autocomplete="off">
            <label for="sip-target">被叫</label>
            <input id="sip-target" placeholder="分机号或 sip:用户@主机" maxlength="384" required disabled>
            <div class="sim-controls">
              <button id="dial" type="submit" disabled>呼出</button>
              <button id="answer" class="secondary" type="button" disabled>接听</button>
              <button id="hangup" class="secondary" type="button" disabled>挂断</button>
            </div>
          </form>
          <p class="muted field-hint">通话时发送 440 Hz 测试音。收到的音频可试听最近 20 秒。</p>
          <section id="call-metrics" class="sip-metrics" aria-label="RTP 音频" hidden>
            <p id="scenario-result" class="field-hint" role="status" hidden></p>
            <p id="prack-summary" class="field-hint" hidden></p>
            <p id="early-summary" class="field-hint" hidden></p>
            <p id="audio-summary" class="field-hint"></p>
            <label for="audio-fault">单向无声</label>
            <select id="audio-fault" aria-describedby="audio-fault-hint" disabled>
              <option value="off">关闭</option><option value="send">暂停发送</option><option value="receive">丢弃接收</option>
            </select>
            <p class="muted field-hint" id="audio-fault-hint">保持通话接通，暂停一个方向的音频。</p>
            <div class="sim-fields sip-metrics">
              <div><h3>发送 RTP</h3><dl class="onvif-addresses" id="send-rtp"></dl></div>
              <div><h3>接收 RTP</h3><dl class="onvif-addresses" id="receive-rtp"></dl></div>
            </div>
          </section>
          <dl id="media-addresses" class="onvif-addresses" hidden>
            <div><dt>通话对端</dt><dd id="call-peer"></dd></div>
            <div><dt>本机实际 RTP</dt><dd id="media-local"></dd></div>
            <div><dt>本机 SDP 声明</dt><dd id="media-advertised"></dd></div>
            <div><dt>对端 SDP 声明</dt><dd id="media-remote"></dd></div>
            <div><dt>对端 RTP 实际来源</dt><dd id="media-observed"></dd></div>
            <div><dt>实际 RTP 回包目的地</dt><dd id="media-destination"></dd></div>
            <div id="media-change" hidden><dt>最近一次 SDP 重协商</dt><dd id="media-change-detail"></dd></div>
          </dl>
          <div id="dtmf-panel" class="sip-metrics" hidden>
            <label for="dtmf-digit">DTMF 按键</label>
            <div class="sim-controls">
              <select id="dtmf-digit" aria-label="DTMF 按键"></select>
              <button id="send-dtmf" class="secondary" type="button" disabled>发送按键</button>
            </div>
            <p id="dtmf-events" class="field-hint muted"></p>
          </div>
          <p id="call-error" class="sim-error" hidden></p>
          <div class="sip-audio" id="received-audio" hidden>
            <button id="hear-audio" class="secondary" type="button">试听接收音频</button>
            <audio id="audio-player" controls preload="none" aria-label="收到的 SIP 音频" hidden></audio>
          </div>
        </div>
      </section>
      <section class="panel sip-events-panel" aria-labelledby="sip-events-title">
        <div class="panel-heading"><h2 id="sip-events-title">SIP 信令</h2></div>
        <p id="no-events" class="muted panel-body">注册和通话事件会显示在这里。</p>
        <ol id="sip-events" class="sim-events" aria-label="最近的 SIP 信令"></ol>
      </section>
    </div>
  </main>
</body>
</html>
