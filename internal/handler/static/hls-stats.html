<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HLS 分析 · Stream Analyzer</title>
  <link rel="stylesheet" href="/static/workbench-theme.css">
  <link rel="stylesheet" href="/static/hls-stats.css">
  <script src="/static/workbench-navigation.js" defer></script>
  <script src="/static/hls-stats.js" defer></script>
</head>
<body class="workbench-tool-page">
  <!-- workbench-header -->
  <main class="container hls-tool">
    <!-- diagnostic-tools -->
    <header class="hls-heading">
      <h1>HLS 交付分析</h1>
      <p>检查播放列表、分片请求和缓存。用 A/B 对比定位两路交付差异。</p>
    </header>
    <form class="hls-panel" id="hls-form" aria-labelledby="hls-form-title">
      <h2 id="hls-form-title">配置分析</h2>
      <fieldset id="hls-fields">
        <div class="hls-setup">
          <div>
            <label for="hls-command">分析方式</label>
            <select id="hls-command" aria-describedby="hls-mode-hint">
              <option value="analyze">抽样分片</option>
              <option value="manifest">检查播放列表</option>
              <option value="monitor">监控直播窗口</option>
              <option value="compare">A/B 对比</option>
            </select>
          </div>
          <div>
            <label for="hls-url" id="hls-url-label">播放列表地址</label>
            <input type="url" id="hls-url" placeholder="https://example.com/live/index.m3u8" required>
          </div>
          <div class="hls-full" id="hls-second" hidden>
            <label for="hls-url-b">B 路播放列表</label>
            <input type="url" id="hls-url-b" placeholder="https://example.com/backup/index.m3u8">
          </div>
        </div>
        <p id="hls-mode-hint" class="hls-muted"></p>
        <details class="hls-options">
          <summary>采样参数</summary>
          <div class="hls-params">
            <div data-segment-option><label for="hls-segments">分片数</label><input id="hls-segments" type="number" min="1" value="10" required></div>
            <div data-segment-option><label for="hls-variant">档位（-1 为自动）</label><input id="hls-variant" type="number" min="-1" value="-1" required></div>
            <div data-segment-option><label for="hls-duration">任务时限（例如 30s）</label><input id="hls-duration" value="30s" required></div>
            <div><label for="hls-timeout">请求超时（例如 10s）</label><input id="hls-timeout" value="10s" required></div>
            <div data-segment-option><label for="hls-error-threshold">错误率阈值（%）</label><input id="hls-error-threshold" type="number" min="0" max="100" step="0.1" value="0" required></div>
          </div>
          <div class="hls-checks" data-segment-option>
            <label><input type="checkbox" id="hls-parse">解析分片 PTS 和关键帧</label>
            <label><input type="checkbox" id="hls-all">采样所有档位</label>
          </div>
        </details>
      </fieldset>
      <div class="hls-actions">
        <button type="submit" id="hls-start">开始分析</button>
        <button type="button" id="hls-stop" class="hls-secondary" hidden>停止分析</button>
        <p id="hls-status" role="status"></p>
      </div>
    </form>
    <section id="hls-results" aria-labelledby="hls-results-title" hidden>
      <header class="hls-results-heading">
        <h2 id="hls-results-title">分析结果</h2>
        <button type="button" id="hls-export" class="hls-secondary">保存报告 JSON</button>
      </header>
      <div id="hls-report"></div>
    </section>
  </main>
</body>
</html>
